name: '[dev] Deploy dvpn native indexer'

on: 
  push:
    branches: 
      - feature/dvpn_nodes

jobs:
  dev_deploy__dvpn_native_indexer:
    uses: ./.github/workflows/dvpn-native-indexer-service.yaml
    with:
      SWR_ORGANIZATION: dev-qubetics
      ARGOCD_BRANCH: dev
      HUAWEI_REGION: 'ap-southeast-3'
      ARGOCD_REPOSITORY: Qubetics/argocd-qubetics
      DEPLOYMENT_PATH: Dvpn-native-indexer/native-indexer-deployment.yaml
      HUAWEI_IMAGE: dvpn-native-indexer
      DOCKER_USERNAME: ap-southeast-3@BQG9INQF0BKVHSNQOLJG
      ENV: ${{ vars.DEV_DVPN_NATIVE_INDEXER_ENV }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD_DEV }}
      GIT_SSH_KEY: ${{ secrets.ARGOCD_SSH_KEY }}
