name: Build and Push Docker Image with OIDC

on:
  push:
    branches:
      - testnet

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUAWEI_IMAGE: testnet-native-indexer
      ARGOCD_REPO: ${{ secrets.ARGOCD_REPO }}
      DEPLOYMENT_PATH: ${{ secrets.DEPLOYMENT_PATH }}
      DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
      GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
      GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
      BRANCH: ${{ secrets.BRANCH }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install OIDC Client from Core Package
        run: npm install @actions/core @actions/http-client

      - name: Authenticate with Huawei SWR
        id: login
        run: |
           docker login -u ap-southeast-3@BQG9INQF0BKVHSNQOLJG -p e054dff1ba4cc985788f9dc974550f1f55ed81c4841a80038fe0b58765395bc6 swr.ap-southeast-3.myhuaweicloud.com
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        run: |
          docker build -t swr.ap-southeast-3.myhuaweicloud.com/testnet-qubetics/$HUAWEI_IMAGE:${{ github.run_number }} .

      - name: Push Docker Image to Huawei SWR
        run: |
          docker push swr.ap-southeast-3.myhuaweicloud.com/testnet-qubetics/$HUAWEI_IMAGE:${{ github.run_number }}

      - name: Configure Deploy Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts

      - name: Update ArgoCD Deployment
        run: |
          git clone $ARGOCD_REPO
          cd $(basename $ARGOCD_REPO .git)
          git checkout $BRANCH
          sed -i "s|\(image: \).*|\1swr.ap-southeast-3.myhuaweicloud.com/testnet-qubetics/$HUAWEI_IMAGE:${{ github.run_number }}|" $DEPLOYMENT_PATH
          git config user.name "$GIT_USERNAME"
          git config user.email "$GIT_EMAIL"
          git add .
          git commit -m "Update image to swr.ap-southeast-3.myhuaweicloud.com/testnet-qubetics/$HUAWEI_IMAGE:${{ github.run_number }}"
          git push origin $BRANCH
